[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lodex-core"
version = "0.2.0"
description = "Shared local environment management and session history for Lodex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<0.29",
  "ollama>=0.6,<0.7",
  "sqlite-vec>=0.1.9,<0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lodex_core"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]
