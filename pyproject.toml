[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lodex"
version = "0.2.0"
description = "Local-first retrieval for coding-agent session history"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.5,<5",
  "httpx>=0.28,<0.29",
  "mcp>=1.28,<2",
  "ollama>=0.6,<0.7",
  "sqlite-vec>=0.1.9,<0.2",
]

[project.scripts]
lodex = "lodex.cli:main"

[dependency-groups]
dev = [
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.6,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lodex"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
  "ollama: requires a running local Ollama service and installed embedding model",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
