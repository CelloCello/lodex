[tool.uv.workspace]
members = ["core", "cli", "console/server"]

[tool.uv.sources]
lodex = { workspace = true }
lodex-core = { workspace = true }
lodex-console = { workspace = true }

[dependency-groups]
dev = [
  "lodex[console]",
  "hatchling>=1.27,<2",
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.6,<0.17",
]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
consider_namespace_packages = true
pythonpath = ["."]
markers = [
  "ollama: requires a running local Ollama service and installed embedding model",
]
testpaths = ["core/tests", "cli/tests", "console/server/tests", "console/tests", "examples/multi_service/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["lodex_core", "lodex_cli", "lodex_console"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = ["core/src", "cli/src", "console/server/src"]
files = ["core/src", "cli/src", "console/server/src", "core/tests", "cli/tests", "console/server/tests", "console/tests", "examples/multi_service", "scripts/verify_environments.py"]
